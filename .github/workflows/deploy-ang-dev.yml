name: Deploy ang-dev to hosting

on:
  push:
    branches:
      - ang-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: optima-service-angular/package-lock.json

      - name: Install dependencies
        working-directory: optima-service-angular
        run: npm ci

      - name: Build
        working-directory: optima-service-angular
        run: npm run build -- --configuration production

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: optima-service-angular/dist/optima-service-angular/browser/
          server-dir: /larina-site/public_html/
          dangerous-clean-slate: false
