backend:
  name: git-gateway
  branch: feature/blog-decap-cms

# Пути ниже — от корня репозитория (его видит git-gateway), а не от папки
# с этим config.yml, поэтому с префиксом optima-service-angular/.

# Куда Decap CMS будет коммитить загруженные картинки для постов.
media_folder: "optima-service-angular/public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Блог"
    folder: "optima-service-angular/content/blog"
    create: true
    # Заголовки на кириллице Decap CMS не транслитерирует в латиницу — поэтому
    # адрес страницы берётся из отдельного поля "slug", а не из title.
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - label: "Адрес страницы (латиницей, через дефис)"
        name: "slug"
        widget: "string"
        hint: "Например: kak-chasto-chistit-stiralnuyu-mashinu. Виден в URL, менять после публикации не стоит."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Только латинские строчные буквы, цифры и дефисы"]
      - { label: "Дата публикации", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Короткое описание (для карточки и SEO)", name: "excerpt", widget: "text" }
      - { label: "Обложка", name: "cover", widget: "image", required: false }
      - { label: "Теги", name: "tags", widget: "list", required: false }
      - { label: "Текст поста", name: "body", widget: "markdown" }
