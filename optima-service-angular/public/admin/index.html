<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Админка блога — Optima Сервис</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Сайт с /admin отдаётся не с Netlify, а с нашего хостинга —
    // поэтому виджету явно указываем, к какому Netlify-сайту (созданному
    // только ради Identity/Git Gateway) обращаться за авторизацией.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: 'https://fancy-longma-9906c5.netlify.app/.netlify/identity'
      });
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Заголовки статей — на кириллице, а URL должен быть латиницей.
    // Decap CMS сама транслитерацию не делает, поэтому перед каждым
    // сохранением сами превращаем title в slug (поле "slug" в
    // config.yml скрыто от редактора — это ровно то же самое поле,
    // которое читает scripts/generate-blog-data.mjs).
    (function () {
      var TRANSLIT = {
        а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i',
        й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't',
        у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '',
        э: 'e', ю: 'yu', я: 'ya'
      };

      function slugify(text) {
        var transliterated = String(text || '').toLowerCase().split('').map(function (ch) {
          return Object.prototype.hasOwnProperty.call(TRANSLIT, ch) ? TRANSLIT[ch] : ch;
        }).join('');
        return transliterated.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      function registerSlugHook() {
        if (!window.CMS || !window.CMS.registerEventListener) {
          setTimeout(registerSlugHook, 50);
          return;
        }
        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function (args) {
            var entry = args.entry;
            var data = entry.get('data');
            if (entry.get('collection') !== 'blog') {
              return data;
            }
            var slug = slugify(data.get('title'));
            return data.set('slug', slug || 'post');
          }
        });
      }

      registerSlugHook();
    })();
  </script>
</body>
</html>
