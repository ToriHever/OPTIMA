<app-hero-section
  titleLine1="Ремонт компьютеров"
  titleAccent="и гаджетов"
  subtitle="Сервисный центр «Optima» — профессиональный ремонт ноутбуков, смартфонов, планшетов, ПК, мониторов и принтеров. Диагностика бесплатно, гарантия до 90 дней."
  [features]="heroFeatures"
  imageUrl="/assets/img/hero/kompyutery.jpg"
  ctaPrimaryText="Вызвать мастера"
  ctaSecondaryText="Узнать стоимость"
  ctaSecondaryScrollTarget="services-kompyutery"
  [breadcrumbs]="[{label: 'Главная', path: '/'}, {label: 'Компьютеры и гаджеты'}]"
></app-hero-section>

<app-categories-grid
  sectionId="services-kompyutery"
  navTitle="Виды техники"
  cardStyle="photo-overlay"
  sectionTitle="Что мы"
  sectionTitleAccent="ремонтируем"
  sectionDescription="Ремонтируем все виды компьютерной и цифровой техники. Ноутбуки, смартфоны, планшеты, ПК, мониторы, принтеры, умные часы."
  [stats]="categoryStats"
  ctaTitle="Не нашли свою технику?"
  ctaDescription="Ремонтируем любую цифровую технику. Напишите — разберёмся."
  [categories]="categories"
></app-categories-grid>

<app-process-accordion
  sectionTitle="Как проходит"
  sectionTitleAccent="ремонт"
  sectionDescription="Простой и прозрачный процесс — от заявки до получения техники с гарантией."
  navTitle="Процесс ремонта"
  [stats]="processStats"
  [steps]="processSteps"
></app-process-accordion>

<app-faq-section
  [questions]="faqItems"
  navTitle="FAQ"
></app-faq-section>

<app-reviews-section></app-reviews-section>
<app-page-progress-nav></app-page-progress-nav>
