<ng-container *ngIf="data">
  <app-tech-hero
    [titleLine1]="data.hero.titleLine1"
    [titleAccent]="data.hero.titleAccent"
    [subtitle]="data.hero.subtitle"
    [features]="data.hero.features"
    [imageUrl]="data.hero.image"
    ctaPrimaryText="Вызвать мастера"
    ctaSecondaryText="Узнать стоимость"
    [ctaSecondaryScrollTarget]="'services-' + data.slug"
    [breadcrumbs]="breadcrumbs"
  ></app-tech-hero>
<app-brand-selector
    [brands]="brands"
    [basePath]="brandBasePath"
    [deviceName]="data.hero.titleAccent"
  ></app-brand-selector>
  <app-categories-grid
    [sectionId]="'services-' + data.slug"
    navTitle="Неисправности"
    cardStyle="photo"
    [sectionTitle]="data.categories.sectionTitle"
    [sectionTitleAccent]="data.categories.sectionTitleAccent"
    [sectionDescription]="data.categories.sectionDescription"
    [stats]="data.categories.stats"
    [ctaTitle]="data.categories.ctaTitle"
    [ctaDescription]="data.categories.ctaDescription"
    [categories]="data.categories.items"
  ></app-categories-grid>
  <app-process-accordion
    [sectionTitle]="data.process.sectionTitle"
    [sectionTitleAccent]="data.process.sectionTitleAccent"
    [sectionDescription]="data.process.sectionDescription"
    navTitle="Процесс ремонта"
    [stats]="data.process.stats"
    [steps]="data.process.steps"
  ></app-process-accordion>

  <app-trust-block
    [deviceGenitive]="data.categories.sectionTitleAccent"
    [brands]="brands"
  ></app-trust-block>

  <app-faq-section
    [questions]="data.faq"
    navTitle="FAQ"
  ></app-faq-section>

  <app-reviews-section></app-reviews-section>
  <app-page-progress-nav></app-page-progress-nav>
</ng-container>
