<section id="process" class="process-section">
  <div class="container">
    <!-- Двухколоночный layout -->
    <div class="process-layout">
      
      <!-- Левая колонка - этапы -->
      <div class="process-content">
        <div class="process-steps">
          <div class="step-item" 
               *ngFor="let step of processSteps; let i = index"
               [class.active]="activeStep === i">
            
            <!-- Заголовок шага (всегда видим) -->
            <div class="step-header" (click)="toggleStep(i)">
              <div class="step-number-wrapper">
                <div class="step-number">{{ i + 1 }}</div>
                <div class="step-line" *ngIf="i < processSteps.length - 1"></div>
              </div>
              
              <div class="step-main">
                <div class="step-title-row">
                  <h3 class="step-title">{{ step.title }}</h3>
                </div>
                <p class="step-subtitle">{{ step.subtitle }}</p>
                
                <div class="step-toggle" [class.rotated]="activeStep === i">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                    <path d="M5 7.5L10 12.5L15 7.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Детали шага (раскрывающиеся) -->
            <div class="step-details" 
                 [class.open]="activeStep === i"
                 [@slideDown]="activeStep === i ? 'open' : 'closed'">
              <div class="details-content">
                <p class="details-description">{{ step.description }}</p>
                
                <ul class="details-features">
                  <li *ngFor="let feature of step.features">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                      <path d="M5 8L7 10L11 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    {{ feature }}
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Правая колонка - заголовок (sticky) -->
      <aside class="process-sidebar">
        <div class="sidebar-content">
          <h2 class="section-title">
            Как мы <span class="text-gradient">работаем</span>
          </h2>
          <p class="section-description">
            Простой и прозрачный процесс от заявки до выдачи отремонтированной техники.
          </p>
          
          <!-- Преимущества компактно -->
          <div class="sidebar-features">
            <div class="feature-item">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 6V12L15 15" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="9" stroke-width="2"/>
              </svg>
              <span>Быстро</span>
            </div>
            <div class="feature-item">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9 12L11 14L15 10" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="9" stroke-width="2"/>
              </svg>
              <span>Качественно</span>
            </div>
            <div class="feature-item">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 8L14 12H18L15 15L16 19L12 16L8 19L9 15L6 12H10L12 8Z" stroke-width="2"/>
              </svg>
              <span>С гарантией</span>
            </div>
          </div>
          
          <div class="sidebar-stats">
            <div class="stat-item">
              <span class="stat-number">6</span>
              <span class="stat-label">этапов работы</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">2 года</span>
              <span class="stat-label">гарантия</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>
