<header class="header">
  <!-- Верхняя часть шапки -->
  <div class="header-top">
    <div class="header-contacts">
      <a href="https://yandex.ru/maps/39/rostov-na-donu/house/ulitsa_larina_18/Z0AYcQdpS0IEQFptfX50dH1kZA==/?ll=39.709272%2C47.255170&z=17.06" 
         class="header-contact">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2C5.79 2 4 3.79 4 6C4 8.5 8 14 8 14C8 14 12 8.5 12 6C12 3.79 10.21 2 8 2Z"
                stroke="currentColor" stroke-width="1.5" />
          <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.5" />
        </svg>
        Ростов-на-Дону, ул. Ларина, 18
      </a>
      
      <a href="mailto:larina@optima-sc.ru" class="header-contact">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4L8 8L14 4" stroke="currentColor" stroke-width="1.5" />
          <rect x="2" y="3" width="12" height="10" rx="1" stroke="currentColor" stroke-width="1.5" />
        </svg>
        Email: larina&#64;optima-sc.ru
      </a>
      
      <a href="tel:89885163131" class="header-contact">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
          <path class="st0" d="M14,11v1.8c0,.7-.5,1.2-1.2,1.2,0,0,0,0-.1,0-1.9-.2-3.6-.8-5.2-1.8-1.5-.9-2.7-2.2-3.6-3.6-1-1.6-1.7-3.4-1.9-5.2,0-.7.4-1.2,1.1-1.3,0,0,0,0,.1,0h1.8c.6,0,1.1.4,1.2,1,0,.6.2,1.1.4,1.7.2.4,0,.9-.3,1.3l-.8.8c.9,1.5,2.1,2.8,3.6,3.6l.8-.8c.3-.3.8-.4,1.3-.3.5.2,1.1.3,1.7.4.6,0,1.1.6,1,1.2Z"/>
        </svg>
        8 (988) 516-31-31
      </a>
      
      <div class="header-contact">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="3" y="2" width="10" height="12" rx="1" stroke="currentColor" stroke-width="1.5" />
          <path d="M7 12H9" stroke="currentColor" stroke-width="1.5" />
        </svg>
        <div class="header-contact">
          Пн-Пт с 9:00 до 18:00<br>
          <span class="text-small">Сб: 10:00-16:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Основная часть шапки -->
  <div class="header-main">
    <div class="container">
      <div class="header-content">
        <a routerLink="/" (click)="scrollTo('hero')" class="logo">
          <img src="assets/logo/logo.png" alt="Оптима Сервис" width="140" height="50">
        </a>

        <nav class="nav" [class.active]="isMenuOpen">
          <a routerLink="/" (click)="scrollTo('hero')" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            Главная
          </a>
          <a routerLink="/" (click)="scrollTo('process')" fragment="process" class="nav-link">
            Как работаем
          </a>
          <a routerLink="/" (click)="scrollTo('warranty')" fragment="warranty" class="nav-link">
            Гарантии
          </a>
          <a routerLink="/" (click)="scrollTo('services')" fragment="services" class="nav-link">
            Услуги
          </a>
          <a routerLink="/" (click)="scrollTo('certificates')" fragment="certificates" class="nav-link">
            Авторизации
          </a>
          <a routerLink="/about" class="nav-link" routerLinkActive="active">
            О нас
          </a>
        </nav>

        <button class="btn btn-primary" (click)="openRepairStatusModal()">
          Статус ремонта
        </button>

        <button 
          class="mobile-menu-btn" 
          [class.active]="isMenuOpen"
          (click)="toggleMenu()"
          aria-label="Открыть меню">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </div>
</header>
