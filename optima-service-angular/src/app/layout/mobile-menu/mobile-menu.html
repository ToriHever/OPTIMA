<!-- Backdrop -->
<div
  *ngIf="isOpen"
  class="mobile-menu-backdrop"
  [@overlayFade]
  (click)="onClose()">
</div>

<!-- Drawer -->
<div
  *ngIf="isOpen"
  class="mobile-menu-drawer"
  [@drawerSlide]>

  <!-- Header -->
  <div class="drawer-header">
    <a routerLink="/" (click)="scrollTo('hero')" class="drawer-logo">
      <img src="assets/logo/logo.png" alt="Оптима Сервис" width="130" height="46">
    </a>
    <button class="drawer-close" (click)="onClose()" aria-label="Закрыть меню">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M18 6L6 18M6 6L18 18" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Navigation links -->
  <nav class="drawer-nav">
    <a routerLink="/" (click)="scrollTo('hero')" class="drawer-link"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 12L12 3L21 12V20a1 1 0 01-1 1H15v-6H9v6H4a1 1 0 01-1-1V12z"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Главная
    </a>

    <a routerLink="/remont-bytovoy-tekhniki" class="drawer-link" routerLinkActive="active" (click)="onClose()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="4" y="6" width="16" height="12" rx="2" stroke-width="2"/>
        <path d="M8 10h8M8 14h5" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Бытовая техника
    </a>

    <a routerLink="/remont-kompyuterov" class="drawer-link" routerLinkActive="active" (click)="onClose()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"/>
        <path d="M8 21h8M12 17v4" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Компьютеры и гаджеты
    </a>

    <a routerLink="/remont-audiovideo" class="drawer-link" routerLinkActive="active" (click)="onClose()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="2" y="4" width="20" height="12" rx="2" stroke-width="2"/>
        <path d="M8 20h8M12 16v4" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="10" r="2" stroke-width="2"/>
      </svg>
      Аудио и видео
    </a>

    <a routerLink="/" (click)="scrollTo('services')" class="drawer-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 7H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2V9a2 2 0 00-2-2h-3M9 7V5a2 2 0 014 0v2M9 7h6"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Цены
    </a>

    <a routerLink="/" (click)="scrollTo('process')" class="drawer-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Как работаем
    </a>

    <a routerLink="/" (click)="scrollTo('warranty')" class="drawer-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Гарантии
    </a>

    <a routerLink="/" (click)="scrollTo('certificates')" class="drawer-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Авторизации
    </a>

    <a routerLink="/about" class="drawer-link" routerLinkActive="active" (click)="onClose()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      О нас
    </a>
  </nav>

  <!-- Divider -->
  <div class="drawer-divider"></div>

  <!-- Contact info block -->
  <div class="drawer-contacts">
    <div class="contacts-title">Контакты</div>

    <a href="tel:89885163131" class="contact-row contact-row--phone">
      <div class="contact-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M14,11v1.8c0,.7-.5,1.2-1.2,1.2,0,0,0,0-.1,0-1.9-.2-3.6-.8-5.2-1.8-1.5-.9-2.7-2.2-3.6-3.6-1-1.6-1.7-3.4-1.9-5.2,0-.7.4-1.2,1.1-1.3,0,0,0,0,.1,0h1.8c.6,0,1.1.4,1.2,1,0,.6.2,1.1.4,1.7.2.4,0,.9-.3,1.3l-.8.8c.9,1.5,2.1,2.8,3.6,3.6l.8-.8c.3-.3.8-.4,1.3-.3.5.2,1.1.3,1.7.4.6,0,1.1.6,1,1.2Z"
                transform="translate(3,3)"/>
        </svg>
      </div>
      <div class="contact-text">
        <span class="contact-label">Телефон</span>
        <span class="contact-value">8 (988) 516-31-31</span>
      </div>
    </a>

    <a href="https://yandex.ru/maps/39/rostov-na-donu/house/ulitsa_larina_18/Z0AYcQdpS0IEQFptfX50dH1kZA==/"
       target="_blank" rel="noopener noreferrer"
       class="contact-row">
      <div class="contact-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 4.25 7 13 7 13s7-8.75 7-13c0-3.87-3.13-7-7-7z"
                stroke-width="2"/>
          <circle cx="12" cy="9" r="2.5" stroke-width="2"/>
        </svg>
      </div>
      <div class="contact-text">
        <span class="contact-label">Адрес</span>
        <span class="contact-value">Ростов-на-Дону, ул. Ларина, 18</span>
      </div>
    </a>

    <div class="contact-row">
      <div class="contact-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="5" y="3" width="14" height="18" rx="1" stroke-width="2"/>
          <path d="M9 15h2M13 15h2M9 11h2M13 11h2M9 7h6" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="contact-text">
        <span class="contact-label">График работы</span>
        <span class="contact-value">Пн–Пт: 9:00–18:00</span>
        <span class="contact-value">Сб: 10:00–16:00</span>
        <span class="contact-value contact-value--muted">Вс: выходной</span>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="drawer-divider"></div>

  <!-- CTA buttons -->
  <div class="drawer-actions">
    <button class="btn btn-primary btn-large drawer-btn" (click)="openRepairStatusModal()">
      Статус ремонта
    </button>

    <!-- Social links -->
    <div class="drawer-social">
      <a href="https://vk.com/optimascmix" class="social-icon" aria-label="ВКонтакте" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

        </svg>
      </a>
      <a href="https://t.me/optimascrnd" class="social-icon" aria-label="Telegram" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

        </svg>
      </a>
      <a href="https://wa.me/79885163131" class="social-icon" aria-label="WhatsApp" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

</div>
