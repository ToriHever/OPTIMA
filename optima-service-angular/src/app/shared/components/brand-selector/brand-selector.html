<section class="brand-selector" id="brands" data-nav-title="Ремонт по брендам" *ngIf="brands.length > 0">
  <div class="container">
    <div class="brand-selector__header">
      <div class="brand-selector__title-block">
        <h2 class="section-title">
          Ремонт по<br>
          <span class="text-gradient">брендам</span>
        </h2>
        <p class="brand-selector__subtitle" *ngIf="deviceName">
          Выберите производителя — откроется страница ремонта {{ deviceName }} именно этого бренда с актуальными ценами и особенностями.
        </p>
      </div>
    </div>

    <div class="brand-selector__grid">
      <a
        *ngFor="let brand of brands"
        [routerLink]="basePath + '/' + brand.slug"
        class="brand-card">
        <div class="brand-card__name">{{ brand.brandName }}</div>
        <div class="brand-card__hint" *ngIf="deviceName">{{ deviceName }} {{ brand.brandName }}</div>
        <div class="brand-card__arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </a>
    </div>
  </div>
</section>
