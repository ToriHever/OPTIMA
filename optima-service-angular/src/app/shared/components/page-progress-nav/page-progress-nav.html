<nav class="page-progress-nav" [class.visible]="isVisible" *ngIf="isVisible">
  <!-- Навигационные элементы -->
  <div class="nav-items">
    <button 
      *ngFor="let item of navItems; let i = index"
      class="nav-item"
      [class.active]="currentSection === i"
      [class.completed]="item.progress === 100"
      (click)="scrollToSection(i)"
      [attr.aria-label]="'Перейти к разделу: ' + getDisplayTitle(item)">
      
      <!-- Прогресс-бар как фон -->
      <div class="item-background">
        <div class="progress-fill" [style.width.%]="item.progress"></div>
      </div>
      
      <!-- Название секции -->
      <span class="item-title">{{ getDisplayTitle(item) }}</span>
      
      <!-- Индикатор завершения -->
      <!-- <svg *ngIf="item.progress === 100" class="check-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M4 8L7 11L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg> -->
    </button>
  </div>
  
  <!-- Общий прогресс страницы (тонкая линия сверху) -->
  <div class="total-progress">
    <div class="total-progress-fill" [style.width.%]="totalProgress"></div>
  </div>
</nav>
