<div class="cta-banner">
  <div class="cta-banner__content">
    <h3 class="cta-banner__title">{{ title }}</h3>
    <p class="cta-banner__desc">{{ description }}</p>
  </div>
  <div class="cta-banner__actions">
    <button class="btn btn-primary" (click)="openQuestion()">{{ primaryLabel }}</button>
    <a [href]="phone" class="btn btn-secondary">{{ secondaryLabel }}</a>
  </div>
</div>
