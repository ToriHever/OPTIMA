<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00444D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#30676E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00444D;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Основной фон -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>
  
  <!-- Сетка -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Декоративные круги -->
  <circle cx="1600" cy="300" r="200" fill="rgba(136, 212, 221, 0.1)"/>
  <circle cx="300" cy="800" r="150" fill="rgba(136, 212, 221, 0.08)"/>
  <circle cx="1400" cy="700" r="180" fill="rgba(136, 212, 221, 0.12)"/>
  
  <!-- Абстрактные формы -->
  <path d="M 1200 100 Q 1400 200 1500 400 Q 1600 600 1700 500" 
        stroke="rgba(136, 212, 221, 0.15)" 
        stroke-width="3" 
        fill="none"/>
  
  <path d="M 400 200 Q 300 400 500 600 Q 700 800 600 900" 
        stroke="rgba(136, 212, 221, 0.1)" 
        stroke-width="2" 
        fill="none"/>
</svg>